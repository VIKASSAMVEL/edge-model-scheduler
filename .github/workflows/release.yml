name: EdgeModelScheduler Production Release & Package Publication

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Production Release Assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3-dev pybind11-dev python3-pip

      - name: Build C++17 Core & Debian Package
        run: |
          cd edge-model-scheduler
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG"
          make -j$(nproc)
          ctest --output-on-failure
          cpack -G DEB

      - name: Build Python Wheel Distribution
        run: |
          python3 -m pip install --upgrade pip build
          cd edge-model-scheduler
          python3 -m build

      - name: Assemble Release Assets
        run: |
          mkdir -p dist
          cp edge-model-scheduler/build/*.deb dist/
          cp edge-model-scheduler/dist/*.whl dist/
          cp edge-model-scheduler/dist/*.tar.gz dist/
          cp edge-model-scheduler/systemd/edge-scheduler.service dist/
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
            dist/edge-scheduler.service
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-ghcr-package:
    name: Publish Container Image to GitHub Packages (GHCR)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
